<!DOCTYPE html>
<html>
<head>
<title>Add Item</title>

<style>
body { font-family: Arial; background:#f0f2f5; }

.box {
    width:350px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

input {
    width:90%;
    padding:10px;
    margin:10px 0;
}

button {
    padding:10px;
    width:100%;
    background:#007bff;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Add Item</h2>

<form method="POST" action="/add_item">
<input name="item_name" placeholder="Item">
<input name="description" placeholder="Description">
<input name="location" placeholder="Location">
<input type="date" name="date_lost">

<button>Add Item</button>
</form>

</div>

</body>
</html>
