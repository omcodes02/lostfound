<!DOCTYPE html>
<html>
<head>
<title>Lost & Found</title>

<style>
:root {
    --bg: #121212;
    --text: #e0e0e0;
    --card: #1f1f1f;
    --border: #333;
}

/* LIGHT MODE */
.light-mode {
    --bg: #f5f7fa;
    --text: #111;
    --card: #ffffff;
    --border: #ddd;
}

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    background: var(--card);
    padding: 15px;
    text-align: center;
    font-size: 22px;
    border-bottom: 1px solid var(--border);
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    background: var(--card);
}

/* BUTTONS */
a, button {
    padding: 8px 14px;
    background: #0d6efd;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    border: none;
    cursor: pointer;
}

.logout {
    background: #dc3545;
}

/* SEARCH */
.search-box input {
    padding: 8px;
    border-radius: 6px;
    border: none;
    outline: none;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: var(--card);
    padding: 14px;
    border-bottom: 1px solid var(--border);
}

td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    text-align: center;
}

/* SIMPLE HOVER (NO ANIMATION) */
tr:hover {
    background: rgba(0,123,255,0.08);
}

/* DELETE */
.delete {
    background: #dc3545;
}

/* TOGGLE BUTTON */
.toggle {
    background: #6c757d;
}
</style>
</head>

<body id="body">

<header>
🔍 Lost & Found System
</header>

<div class="top-bar">

    <div>
        <a href="/add">➕ Add</a>
        <a href="/logout" class="logout">Logout</a>
        <button class="toggle" onclick="toggleMode()">🌗 Theme</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search...">
    </div>

</div>

<table id="dataTable">
<tr>
    <th>ID</th>
    <th>Item</th>
    <th>Description</th>
    <th>Location</th>
    <th>Date</th>
    <th>Contact</th>
    <th>Action</th>
</tr>

{% for item in items %}
<tr>
    <td>{{ item[0] }}</td>
    <td>{{ item[1] }}</td>
    <td>{{ item[2] }}</td>
    <td>{{ item[3] }}</td>
    <td>{{ item[4] }}</td>
    <td>{{ item[5] }}</td>
    <td><a href="/delete/{{ item[0] }}" class="delete">Delete</a></td>
</tr>
{% endfor %}

</table>

<script>
/* SEARCH */
document.getElementById("searchInput").addEventListener("keyup", function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll("#dataTable tr");

    for (let i = 1; i < rows.length; i++) {
        let text = rows[i].innerText.toLowerCase();
        rows[i].style.display = text.includes(filter) ? "" : "none";
    }
});

/* TOGGLE MODE */
function toggleMode() {
    document.body.classList.toggle("light-mode");

    if (document.body.classList.contains("light-mode")) {
        localStorage.setItem("theme", "light");
    } else {
        localStorage.setItem("theme", "dark");
    }
}

/* LOAD SAVED MODE */
window.onload = function() {
    let saved = localStorage.getItem("theme");
    if (saved === "light") {
        document.body.classList.add("light-mode");
    }
};
</script>

</body>
</html>
