<!DOCTYPE html>
<html>
<head>
<title>Signup</title>

<style>
body { font-family: Arial; background:#f0f2f5; }

.box {
    width: 350px;
    margin: 50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

input {
    width: 90%;
    padding:10px;
    margin:10px 0;
}

button {
    padding:10px;
    width:100%;
    background:#007bff;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Signup</h2>

<form method="POST">
<input name="username" placeholder="Username">
<input type="password" name="password" placeholder="Password">
<input name="stream" placeholder="Stream">
<input name="class" placeholder="Class">
<input name="roll_no" placeholder="Roll No">
<input name="email" placeholder="Email">

<button>Signup</button>
</form>

<p style="color:red;">{{ message }}</p>

<a href="/login">Back</a>
</div>

</body>
</html>
